{# The HTML emails' greeting: a waving hand over the person's name #}
{% types {name: 'string'} %}
<p style="margin: 0 0 16px; font-size: 32px; line-height: 1.2;"><span role="img" aria-label="Hi">👋</span></p>
<p style="margin: 0 0 20px;"><strong style="color: #512da8; font-size: 20px;">{{ name }}</strong></p>
