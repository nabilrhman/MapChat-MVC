<html>
<head>
    <!-- The design is light only; stop browsers from auto-darkening it -->
    <meta name="color-scheme" content="only light">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="/css/login.css?v=16">
    <link rel="stylesheet" type="text/css" href="/css/animate.css">
    <link rel="stylesheet" href="/css/styles.css?v=7" />
    <link rel="stylesheet" href="/css/footer.css?v=3" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">


    <title>{% block title %}{% endblock %}</title>



</head>

<body>
<div class="section"></div>
<main>
    <center>

        <a href="/">
        <div id="divLogo" class="anim-bounce-in hover-grow">

        </div>
        </a>
        <div class="section"></div>
        <h5 class="white-text" id="heading">{% block heading %}{% endblock %}</h5>
        <div class="section"></div>

        {% block body %}{% endblock %}

        <footer class="footer-login">
            <span>&copy; {{ 'now'|date('Y') }} <a href="https://nabilr.com" class="footer-author">Nabil Rahman</a></span>
        </footer>


    </center>
</main>


</body>


<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
{% include '_flash.html' %}

{% block footer %}{% endblock %}

</html>
