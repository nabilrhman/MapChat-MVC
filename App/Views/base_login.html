<!DOCTYPE html>
<html>
<head>
    <!-- The design is light only; stop browsers from auto-darkening it -->
    <meta name="color-scheme" content="only light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" type="text/css" href="/css/materialize.css">
    <link rel="stylesheet" type="text/css" href="/css/animate.css">
    <link rel="stylesheet" href="/css/styles.css?v=10" />
    <link rel="stylesheet" href="/css/footer.css?v=4" />
    <link rel="stylesheet" href="/css/ui.css?v=8" />
    <link rel="stylesheet" type="text/css" href="/css/login.css?v=28">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">

    <title>{% block title %}{% endblock %}</title>
</head>

<body>
<main>
    <div class="auth-center">
        <a href="/" class="login-logo anim-bounce-in hover-grow" aria-label="MapChat"></a>
        <h1 class="auth-title">{% block heading %}{% endblock %}</h1>

        {% block body %}{% endblock %}
    </div>

    <footer class="footer-login">
        <span>&copy; {{ 'now'|date('Y') }} <a href="https://nabilr.com" class="footer-author">Nabil Rahman</a></span>
    </footer>
</main>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/jquery/2.2.1/jquery.min.js"></script>
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0-beta/js/materialize.min.js"></script>
{% include '_flash.html' %}

{% block footer %}{% endblock %}
</body>
</html>
