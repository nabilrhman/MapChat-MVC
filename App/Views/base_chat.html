{% extends 'base_app.html' %}

{% block title %}Home{% endblock %}

{% block head %}
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/chat.css?v=10">
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
{% endblock %}

{% block chatmodule %}

<div id="map">

    <!--<iframe src="https://snazzymaps.com/embed/100419" width="100%" height="100%" style="border:none;"></iframe>-->
</div>

<div class="chat-container animated fadeInLeftSubtle">

    <div class="chat-list" id="chat-list">
        {% block chats %}

        {% endblock %}
    </div>


    <form class="input-container" method="post" id="input-container-form">
        <div class="input" id="msg">
            <span class="char-count" id="char-count" hidden></span>
            <textarea name="message" placeholder="Type your message" rows="1"
                      class="materialize-textarea" id="textarea-send" maxlength="500" autofocus></textarea>
        </div>

        <button name="send" class="waves-effect waves-light" id="button-send" type="submit"
                aria-label="Send" title="Send" disabled>
            <i class="material-icons">send</i>
        </button>
    </form>

</div>

{% endblock %}

{% block footer %}





<script>
    $(document).ready(function() {

        function updateScroll(e)
        {

            if ($(".chat-list").scrollHeight - elem.scrollTop() == elem.outerHeight())
            {
                $(".chat-list").animate({scrollTop: $(".chat-list").prop("scrollHeight")}, 1000);
            }
            else
            {

            }

        }


        var lastResponse;

        // Ask for new messages every second
        (function update() {
            postForm('/app/get')
                .then(function (response) {
                    if ($.trim(response.data)) {
                        $(".chat-list").append(response.data);
                        $(".chat-list").animate({scrollTop: $(".chat-list").prop("scrollHeight")}, 1000);
                    }
                })
                .catch(function () {
                    // Try again on the next round
                })
                .finally(function () {
                    setTimeout(update, 1000);
                });
        })();

        $('#input-container-form').on('submit', function (e) {
            e.preventDefault();

            var bodyText = $('.materialize-textarea').val().trim();

            postForm('/app/send', {body: bodyText})
                .then(function () {
                    $('.materialize-textarea').val("").trigger('input');
                    M.textareaAutoResize($('.materialize-textarea'));
                })
                .catch(function (error) {
                    var message = errorMessage(error, 'Your message could not be sent.');
                    M.toast({html: $('<div>').text(message).html()});
                });
        });

        // Enter sends, Shift+Enter starts a new line
        $(".materialize-textarea").keypress(function (event) {
            if (event.which == 13 && !event.shiftKey) {
                event.preventDefault();
                if (!$('#button-send').prop('disabled')) {
                    $("#input-container-form").submit();
                }
            }
        });

        // Grey out Send while the box is empty; show the count near the limit
        $('#textarea-send').on('input', function () {
            var length = this.value.length;
            var max = parseInt(this.getAttribute('maxlength'), 10);

            $('#button-send').prop('disabled', this.value.trim() === '');
            $('#char-count')
                .prop('hidden', length < max - 100)
                .toggleClass('over-soon', length > max - 20)
                .text(length + ' / ' + max);
        });

        function scrollToBottom()
        {

            $(".chat-list").animate({scrollTop: $(".chat-list").prop("scrollHeight")}, 1000);

        };

        //$('.chat-list').bind('scroll',updateScroll);

        $(".chat-list").animate({scrollTop: $(".chat-list").prop("scrollHeight")}, 1000);

    });





</script>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type='text/javascript' src='/js/map.js?v=7'></script>



{% endblock %}
