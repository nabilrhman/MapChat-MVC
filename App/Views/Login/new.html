{% extends 'base_login.html' %}

{% block title %}Login{% endblock %}

{% block heading %}Log in{% endblock %}

{% block body %}

<div class="auth-card">

    <form action="/login/create" method="post">

        <div class="input-field">
            <input type="email" id="inputEmail" name="email" value="{{ email }}" autocomplete="email" autofocus/>
            <label for="inputEmail">Email</label>
        </div>

        <div class="input-field">
            <input type="password" id="inputPassword" name="password" class="has-toggle" autocomplete="current-password"/>
            <label for="inputPassword">Password</label>
            <button type="button" class="password-toggle material-icons" aria-label="Show password">visibility</button>
        </div>
        <a href="/password/forgot" class="forgot-link">Forgot password?</a>

        <label class="remember">
            <input type="checkbox" name="remember_me" {% if remember_me %}checked{% endif %}/>
            <span>Remember me</span>
        </label>

        <button type="submit" class="button button-primary button-block" id="submitButton">Log in</button>
    </form>

    <div class="form-divider"><span>or</span></div>

    <form action="/login/guest" method="post" id="guestForm">
        <button type="submit" class="button button-outline button-block">
            <span class="button-label">Try it as a guest</span>
            <span class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
    </form>

    <p class="form-switch"><span>New to MapChat?</span> <a href="/signup/new">Create an account</a></p>
</div>

{% endblock %}

{% block footer %}
<script src="/js/passwordToggle.js"></script>
<script>
    // Making a guest account and finding its location takes a few seconds
    var guestButton = $('#guestForm button');
    $('#guestForm').on('submit', function (event) {
        if (guestButton.hasClass('is-loading')) {
            event.preventDefault();
            return;
        }
        guestButton.addClass('is-loading').attr('aria-busy', 'true');
    });
    // Coming back with the Back button shows the page as it was left
    $(window).on('pageshow', function () {
        guestButton.removeClass('is-loading').removeAttr('aria-busy');
    });
</script>
{% endblock %}
