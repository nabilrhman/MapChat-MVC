{% extends 'base_login.html' %}

{% block title %}Login{% endblock %}

{% block heading %}LOG IN{% endblock %}

{% block body %}

<div class="container">
    <div class="z-depth-1 grey lighten-4 row form-container form-container-custom">

        <form class="col s12" action="/login/create" method="post">

            <div class='row'>
                <div class='input-field col s12'>
                    <input type="email" id="inputEmail" name="email" autofocus value="{{ email }}"/>
                    <label for="inputEmail">Email address</label>
                </div>
            </div>

            <div class='row'>
                <div class='input-field col s12'>
                    <input type="password" id="inputPassword" name="password"/>
                    <label for="inputPassword">Password</label>
                    <a href="/password/forgot" class="forgot-link">Forgot password?</a>
                </div>
            </div>

            <div class="row form-options">
                <label>
                    <input type="checkbox" name="remember_me" {% if remember_me %} checked="checked"{% endif %} />
                    <span>Remember me</span>
                </label>
            </div>

            <div class='row form-actions'>
                <button type='submit' class='btn waves-effect purple' id="submitButton">Log in</button>
            </div>
        </form>

        <div class="col s12 form-divider"><span>or</span></div>

        <form class="col s12" action="/login/guest" method="post">
            <div class='row form-actions'>
                <button type="submit" class="btn btn-outline waves-effect">Try it as a guest</button>
            </div>
        </form>

        <p class="col s12 form-switch"><span>New to MapChat?</span> <a href="/signup/new">Create an account</a></p>
    </div>
</div>

{% endblock %}
