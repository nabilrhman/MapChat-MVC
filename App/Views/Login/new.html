{% extends 'base_login.html' %}

{% block title %}Login{% endblock %}

{% block heading %}Log in{% endblock %}

{% block body %}

<div class="auth-card">

    <form action="/login/create" method="post" class="auth-card__form">

        <div class="input-field">
            <input type="email" id="inputEmail" name="email" value="{{ email }}" autocomplete="email" autofocus/>
            <label for="inputEmail">Email</label>
        </div>

        <div class="input-field">
            <input type="password" id="inputPassword" name="password" class="password-input" autocomplete="current-password"/>
            <label for="inputPassword">Password</label>
            <button type="button" class="password-toggle material-icons" aria-label="Show password">visibility</button>
        </div>
        <a href="/password/forgot" class="auth-card__forgot">Forgot password?</a>

        <label class="auth-card__remember">
            <input type="checkbox" name="remember_me" {% if remember_me %}checked{% endif %}/>
            <span class="auth-card__remember-label">Remember me</span>
        </label>

        <button type="submit" class="button button--primary button--block auth-card__button">Log in</button>
    </form>

    <div class="auth-card__divider"><span class="auth-card__divider-label">or</span></div>

    <form action="/login/guest" method="post" id="guestForm" class="auth-card__form">
        <button type="submit" class="button button--outline button--block auth-card__button">
            <span class="button__label">Try it as a guest</span>
            <span class="loading-dots button__dots" aria-hidden="true"><span class="loading-dots__dot"></span><span class="loading-dots__dot"></span><span class="loading-dots__dot"></span></span>
        </button>
    </form>

    <p class="auth-card__switch"><span>New to MapChat?</span> <a class="auth-card__switch-link" href="/signup/new">Create an account</a></p>
</div>

{% endblock %}

{% block footer %}
<script>
    // Making a guest account and finding its location takes a few seconds
    var guestButton = $('#guestForm button');
    $('#guestForm').on('submit', function (event) {
        if (guestButton.hasClass('is-loading')) {
            event.preventDefault();
            return;
        }
        guestButton.addClass('is-loading').attr('aria-busy', 'true');
    });
    // Coming back with the Back button shows the page as it was left
    $(window).on('pageshow', function () {
        guestButton.removeClass('is-loading').removeAttr('aria-busy');
    });
</script>
{% endblock %}
