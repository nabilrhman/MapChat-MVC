{# A button that also works in Outlook: the colour sits on the table cell, not the link #}
<table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 28px 0;">
    <tr>
        <td bgcolor="#512da8" style="background-color: #512da8;">
            <a href="{{ url }}" style="display: inline-block; padding: 14px 28px; color: #ffffff; font-family: Montserrat, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 600; text-decoration: none;">{{ label }}</a>
        </td>
    </tr>
</table>
