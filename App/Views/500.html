{% extends "base_app.html" %}
{# Shown when the site hits an error, without its details (Core\Error) #}
{% types {} %}

{% block title %}Error{% endblock %}

{% block body %}

<section class="error-page">
    <h4 class="appear-down">500: Internal server error</h4>
    <div class="divider"></div>
    <p>Something went wrong on our end. Please try again in a moment.</p>
    <a href="/" class="button primary">Back to MapChat</a>
</section>

{% endblock %}
