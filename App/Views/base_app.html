<!DOCTYPE html>
<html data-icons="{{ asset('/icons.svg') }}">
<head>
    <!-- The design is light only; stop browsers from auto-darkening it -->
    <meta name="color-scheme" content="only light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %} · MapChat</title>
    {% include '_meta.html' %}

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    {% include '_beer.html' %}
    <link rel="stylesheet" href="{{ asset('/css/base.css') }}" />
    <link rel="stylesheet" href="{{ asset('/css/animations.css') }}" />

    <!-- Styles for the header and footer -->
    <link rel="stylesheet" href="{{ asset('/css/header.css') }}" />
    <link rel="stylesheet" href="{{ asset('/css/footer.css') }}" />

    <link rel="stylesheet" href="{{ asset('/css/styles.css') }}" />
    <link rel="stylesheet" href="{{ asset('/css/ui.css') }}" />

    {% block head %}{% endblock %}
</head>

<body>

{% include '_header.html' %}

{% block content %}
<div class="site-main">
    {% block body %}{% endblock %}
</div>
{% endblock %}

{% include '_footer.html' %}

<script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
<script src="{{ asset('/js/dom.js') }}"></script>
<script src="{{ asset('/js/http.js') }}"></script>
<script src="{{ asset('/js/toast.js') }}"></script>
<script src="{{ asset('/js/loadingBar.js') }}"></script>
<script src="{{ asset('/js/header.js') }}"></script>
<script src="{{ asset('/js/tooltip.js') }}"></script>
{% include '_flash.html' %}

{% block footer %}{% endblock %}
</body>
</html>
