<!DOCTYPE html>
<html>
<head>
    <!-- The design is light only; stop browsers from auto-darkening it -->
    <meta name="color-scheme" content="only light">

    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <!-- <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u" crossorigin="anonymous"> -->

    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" href="/css/materialize.css">
    <link rel="stylesheet" href="/css/animate.css" />

    <!-- Styles for the header and footer -->
    <link rel="stylesheet" href="/css/header.css?v=3" />
    <link rel="stylesheet" href="/css/footer.css?v=3" />

    <link rel="stylesheet" href="/css/styles.css?v=7" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">

    {% block head %}

    {% endblock %}

</head>
<body id="body" class="animated fadeIn">

<div class="header animated fadeIn">
    <a href="/" class="logo hover-grow">MapChat</a>
    <div class="nav-container pull-left animated fadeInDownSubtle">

        {% if current_user %}
        <a href="/logout">LOG OUT</a>
        <a href="/profile/show">PROFILE</a>
        {% else %}
        <a href="/login">LOG IN</a>
        <a href="/signup/new">SIGN UP</a>
        {% endif %}
        <a href="/about">ABOUT</a>

    </div>
</div>




{% block chatmodule %}


{% endblock %}


<footer class="footer">
    <a href="https://github.com/nabilrhman/MapChat-MVC" class="footer-source" title="Source code on GitHub" aria-label="Source code on GitHub"><i class="fab fa-github"></i></a>
    <span>&copy; {{ 'now'|date('Y') }} <a href="https://nabilr.com" class="footer-author">Nabil Rahman</a></span>
</footer>


</body>
<div class="se-pre-con"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/modernizr/2.8.2/modernizr.js"></script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
<script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
<script src="/js/http.js?v=2"></script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.15.0/jquery.validate.min.js"></script>
<!-- Compiled and minified JavaScript -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
{% include '_flash.html' %}

<script src="/js/loading.js"></script>



{% block footer %}
{% endblock %}







</html>
