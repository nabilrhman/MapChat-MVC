<!DOCTYPE html>
<html>
<head>
    <!-- The design is light only; stop browsers from auto-darkening it -->
    <meta name="color-scheme" content="only light">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    {% include '_meta.html' %}

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">

    {% include '_beer.html' %}
    <link rel="stylesheet" href="/css/base.css?v=3" />
    <link rel="stylesheet" href="/css/animations.css?v=5" />

    <!-- Styles for the header and footer -->
    <link rel="stylesheet" href="/css/header.css?v=24" />
    <link rel="stylesheet" href="/css/footer.css?v=6" />

    <link rel="stylesheet" href="/css/styles.css?v=16" />
    <link rel="stylesheet" href="/css/ui.css?v=24" />

    {% block head %}{% endblock %}
</head>

<body>

{% include '_header.html' %}

{% block content %}
<div class="site-main">
    {% block body %}{% endblock %}
</div>
{% endblock %}

{% include '_footer.html' %}

<script src="https://unpkg.com/axios@1.7.9/dist/axios.min.js"></script>
<script src="/js/dom.js?v=2"></script>
<script src="/js/http.js?v=4"></script>
<script src="/js/toast.js?v=4"></script>
<script src="/js/loadingBar.js?v=4"></script>
<script src="/js/header.js?v=2"></script>
<script src="/js/tooltip.js?v=5"></script>
{% include '_flash.html' %}

{% block footer %}{% endblock %}
</body>
</html>
