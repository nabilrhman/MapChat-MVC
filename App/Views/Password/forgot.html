{% extends 'base_login.html' %}

{% block title %}Reset password{% endblock %}

{% block heading %}Reset your password{% endblock %}

{% block body %}

<div class="auth-card">

    <form action="/password/request-reset" method="post" id="formForgot">

        <div class="input-field">
            <input type="email" id="inputEmail" name="email" value="{{ email }}" autocomplete="email" autofocus/>
            <label for="inputEmail">Email</label>
            <span id="error-msg-email"></span>
        </div>

        <button type="submit" class="button button-primary button-block" id="submitButton">Send reset link</button>
    </form>

    <p class="form-switch"><span>Remembered it?</span> <a href="/login">Log in</a></p>
</div>

{% endblock %}

{% block footer %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.15.0/jquery.validate.min.js"></script>
<script src="/js/validatorExtended.js"></script>
<script src="/js/validateEmailForgotPassword.js"></script>

{% endblock %}
