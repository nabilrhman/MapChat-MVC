{% extends 'base_login.html' %}

{% block title %}Reset password{% endblock %}

{% block heading %}Reset your password{% endblock %}

{% block body %}

<div class="auth-card">

    <form action="/password/request-reset" method="post" id="formForgot" class="auth-card__form">

        <div class="input-field">
            <input type="email" id="inputEmail" name="email" value="{{ email }}" autocomplete="email" autofocus/>
            <label for="inputEmail">Email</label>
            <span id="error-msg-email"></span>
        </div>

        <button type="submit" class="button button--primary button--block auth-card__button">Send reset link</button>
    </form>

    <p class="auth-card__switch"><span>Remembered it?</span> <a class="auth-card__switch-link" href="/login">Log in</a></p>
</div>

{% endblock %}
