# Apache with the event MPM: an open keep-alive connection waits in the
# listener thread instead of holding a worker, so each chat tab polling every
# second no longer takes a worker for as long as it stays open. PHP runs in
# PHP-FPM (docker/php-fpm.conf), reached over FastCGI.

ServerName localhost
Listen ${PORT}

<IfModule mpm_event_module>
    # A process closes all its idle keep-alive connections at once when it
    # has more open than its threads + AsyncRequestWorkerFactor x its idle
    # threads. Threads waiting on a busy PHP-FPM aren't idle, so with few
    # threads each, a busy moment cut dozens of polling tabs. Plenty of
    # threads per process (they cost little while waiting) keeps it far off
    ServerLimit              16
    ThreadsPerChild          64
    MaxRequestWorkers        1024
    AsyncRequestWorkerFactor 16
    StartServers             4
    MinSpareThreads          64
    # Never stop a process for having spare threads: that cuts its
    # connections too
    MaxSpareThreads          1024
</IfModule>

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    DirectoryIndex index.php index.html

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
