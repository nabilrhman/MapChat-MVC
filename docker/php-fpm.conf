; PHP-FPM's workers, behind Apache (docker/apache.conf)

[www]
; Each process holds at most one database connection, so this also caps the
; app's connections well under MySQL's 151. Sized for a 512 MB host: a
; request takes about 20 ms, so 20 processes serve far more than 1,000
; requests a second
pm = static
pm.max_children = 20
; Recycle now and then, in case anything leaks
pm.max_requests = 1000

; Apache already logs every request
access.log = /dev/null
