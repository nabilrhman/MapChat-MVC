The site's icons, drawn with Core\Icon in Twig and createIcon() in dom.js.
Each is the 24px Solid weight of an icon from Heroicons by Tailwind Labs
(heroicons.com), under the MIT licence. The ids are older names, kept so
the views and scripts need no change; a new one is copied from
heroicons/24/solid/<name>.svg as another symbol.
"smile-circle-linear" and "microphone-linear" are the Outline weight, so
the message box's tools sit quieter beside Send.

"github" is the GitHub mark from Simple Icons (simpleicons.org), CC0.
"google" is Google's "G" in its own colours, as Google's sign-in branding
guidelines ask (developers.google.com/identity/branding-guidelines).
