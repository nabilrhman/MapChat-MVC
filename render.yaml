# Render Blueprint: New > Blueprint in the Render dashboard, pick this repo.
# The database lives elsewhere (e.g. TiDB Cloud Starter); fill in its details
# when Render asks for the values marked sync: false.
services:
  - type: web
    name: mapchat
    runtime: docker
    plan: free
    # A static file: Apache serves it without PHP or the database
    healthCheckPath: /health.txt
    # The chat's WebSockets (wss://…/ws) come in on this same address; Apache
    # passes them to the chat socket in the container (docker/start.sh)
    # Point a CNAME for this name at the service's onrender.com address.
    # This is my site: for your own, change it and APP_URL (docs/deploy.md)
    domains:
      - mapchat.swiftsolve.net
    envVars:
      # Change to your own address, as with domains above
      - key: APP_URL
        value: https://mapchat.swiftsolve.net
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: mapchat
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: SHOW_ERRORS
        value: "false"
      # Free plans block SMTP ports, so use Brevo's API: brevo+api://API_KEY@default
      - key: MAILER_DSN
        sync: false
      # The sender, on a domain verified with Brevo, e.g. MapChat <no-reply@mail.swiftsolve.net>
      - key: MAIL_FROM
        sync: false
      # Lets MapChat and the demo people chat back (free key at console.groq.com)
      - key: GROQ_API_KEY
        sync: false
      # Web Push for notifications with MapChat closed; make the pair once (docs/deploy.md)
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
